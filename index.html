<!doctype html>
<!--
  index.html — el "esqueleto" de la página.
  HTML solo dice QUÉ hay en la pantalla (cabecera, botones, cajas vacías
  donde irá el calendario). Cómo se ve lo decide styles.css, y lo que hace
  (leer el calendario, dibujar las clases, guardar tus cosas) lo deciden
  los archivos .js.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2a44">
  <title>Mi horario</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Esto permite "Añadir a pantalla de inicio" en el móvil, como si fuera una app -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Ponemos el tema (claro/oscuro) antes de dibujar nada, para que no "parpadee" -->
  <script>
    try {
      const t = localStorage.getItem("mi-horario:tema");
      if (t === "claro" || t === "oscuro") document.documentElement.dataset.tema = t;
    } catch {}
  </script>
</head>
<body>
  <div class="app">

    <!-- ===== Panel lateral: en el ordenador siempre visible, en el móvil se abre con ☰ ===== -->
    <aside id="panel" class="panel" aria-label="Opciones">
      <div class="panel-cabecera">
        <img src="icono.svg" alt="" width="32" height="32">
        <strong>Mi horario</strong>
        <button id="btn-cerrar-panel" class="boton-icono" aria-label="Ocultar menú" title="Ocultar menú">«</button>
      </div>

      <button id="btn-anadir-panel" class="boton-principal">＋ Añadir algo</button>

      <details open data-apartado="mostrar">
        <summary><h2>Mostrar</h2></summary>
        <div id="filtros" class="filtros"></div>
      </details>

      <details open data-apartado="examenes">
        <summary><h2>Próximos exámenes</h2></summary>
        <ul id="lista-examenes" class="lista-examenes"></ul>
      </details>

      <details open data-apartado="entregas">
        <summary><h2>Próximas entregas</h2></summary>
        <ul id="lista-entregas" class="lista-examenes"></ul>
      </details>

      <details open data-apartado="apariencia">
        <summary><h2>Apariencia</h2></summary>
        <div class="selector-tema">
          <button data-tema-opcion="auto">🌓 Auto</button>
          <button data-tema-opcion="claro">☀️ Claro</button>
          <button data-tema-opcion="oscuro">🌙 Oscuro</button>
        </div>
      </details>

      <details open data-apartado="copia">
        <summary><h2>Copia de seguridad</h2></summary>
        <p class="nota">Tus cosas se guardan en este navegador. Exporta una copia de vez en cuando para no perderlas.</p>
        <div class="fila-botones">
          <button id="btn-exportar" class="boton-secundario">⬇ Exportar</button>
          <button id="btn-importar" class="boton-secundario">⬆ Importar</button>
        </div>
        <input id="archivo-importar" type="file" accept=".json,application/json" hidden>
      </details>
    </aside>
    <div id="velo" class="velo"></div>

    <!-- ===== Zona principal ===== -->
    <div class="principal">
      <header class="cabecera">
        <button id="btn-menu" class="boton-icono" aria-label="Abrir menú" title="Abrir menú">☰</button>
        <h1>Mi horario</h1>
        <button id="btn-tema" class="boton-icono boton-tema" aria-label="Cambiar tema">🌓</button>
      </header>

      <div class="selector-vista" role="tablist" aria-label="Vista">
        <button id="btn-dia">Día</button>
        <button id="btn-semana">Semana</button>
        <button id="btn-mes">Mes</button>
        <button id="btn-anio">Año</button>
      </div>

      <nav class="navegacion">
        <button id="btn-anterior" aria-label="Anterior">‹</button>
        <div class="titulo-fecha">
          <span id="titulo-periodo">…</span>
          <button id="btn-hoy">Hoy</button>
        </div>
        <button id="btn-siguiente" aria-label="Siguiente">›</button>
      </nav>

      <main id="calendario">Cargando calendario…</main>

      <footer id="leyenda" class="leyenda"></footer>
    </div>
  </div>

  <!-- Botón redondo para añadir rápido (sobre todo en el móvil) -->
  <button id="btn-anadir" class="fab" aria-label="Añadir algo">＋</button>

  <!-- La ficha que aparece al tocar una clase o una cosa tuya. <dialog> es una
       ventana emergente que ya trae el navegador: se abre con showModal() y se cierra con close(). -->
  <dialog id="ficha" class="ficha">
    <button class="cerrar" aria-label="Cerrar">✕</button>
    <div class="ficha-contenido"></div>
  </dialog>

  <!-- El formulario para añadir o editar tus cosas -->
  <dialog id="formulario" class="ficha formulario">
    <form id="form-personal" method="dialog">
      <header class="form-cabecera">
        <h2 id="form-titulo">Añadir algo</h2>
        <button type="button" class="cerrar" aria-label="Cerrar">✕</button>
      </header>

      <div class="form-cuerpo">
        <label class="campo">
          <span>¿Qué es?</span>
          <input name="titulo" required maxlength="60" placeholder="Ej.: Estudiar señales, gimnasio, comida con Ana…">
        </label>

        <!-- El tipo se elige solo a partir del título; "Cambiar" deja elegirlo a mano -->
        <fieldset class="campo">
          <legend>Tipo</legend>
          <div class="tipo-detectado">
            <span id="tipo-vista" class="tipo-vista"></span>
            <button type="button" id="btn-cambiar-tipo" class="enlace">Cambiar</button>
          </div>
          <div id="form-categorias" class="selector-categorias" hidden></div>
        </fieldset>

        <div class="campo-fila fila-cuando">
          <label class="campo campo-dia"><span>Día</span><input name="fecha" type="date" required></label>
          <label class="campo"><span>Empieza</span><input name="inicio" type="time" required step="300"></label>
          <label class="campo"><span>Termina</span><input name="fin" type="time" required step="300"></label>
        </div>

        <div class="campo-fila">
          <label class="campo">
            <span>Repetir</span>
            <select name="repetir">
              <option value="no">No se repite</option>
              <option value="diario">Todos los días</option>
              <option value="laborables">De lunes a viernes</option>
              <option value="semanal">Cada semana</option>
            </select>
          </label>
          <label class="campo" id="campo-hasta"><span>Hasta el día</span><input name="hasta" type="date"></label>
        </div>

        <label class="campo"><span>Lugar <small>(opcional)</small></span><input name="lugar" maxlength="60" placeholder="Biblioteca, gimnasio…"></label>
        <label class="campo"><span>Notas <small>(opcional)</small></span><textarea name="notas" rows="2" maxlength="500" placeholder="Temas que repasar, qué llevar…"></textarea></label>

        <p id="form-error" class="form-error" role="alert"></p>
      </div>

      <footer class="form-pie">
        <button type="button" id="btn-borrar" class="boton-peligro">Borrar</button>
        <span class="hueco"></span>
        <button type="button" id="btn-cancelar" class="boton-secundario">Cancelar</button>
        <button type="submit" class="boton-principal">Guardar</button>
      </footer>
    </form>
  </dialog>

  <!-- El orden importa: primero tus datos, luego las herramientas y al final el programa -->
  <script src="config.js"></script>
  <script src="personal.js"></script>
  <script src="moodle.js"></script>
  <script src="app.js"></script>
</body>
</html>
