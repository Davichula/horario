# =====================================================================
# garmin.yml — el "robot" que instala la función "garmin" en Supabase
# ---------------------------------------------------------------------
# Así no hace falta copiar y pegar el código en el editor de Supabase
# (que en el móvil no deja pegar). GitHub lo hace por ti:
#   - cuando le das al botón "Run workflow" en la pestaña Actions, y
#   - cada vez que cambia algo dentro de supabase/functions/garmin/.
#
# Necesita un "token de acceso" de tu cuenta de Supabase, guardado como
# secreto en Settings > Secrets and variables > Actions con el nombre
# SUPABASE_ACCESS_TOKEN. Así nadie puede verlo aunque el repositorio
# sea público.
# =====================================================================
name: Instalar función de Garmin en Supabase

on:
  workflow_dispatch:          # botón para lanzarlo a mano
  push:
    branches: [main]
    paths: ["supabase/functions/garmin/**"]

permissions:
  contents: read

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que está el token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Instalar la función "garmin"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy garmin --project-ref hcehbosfskzhfockbdor
